<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listening Log</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Listening">
  <meta name="theme-color" content="#F2F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Particle cream ground + charcoal type + distinct band accents */
      --bg: #F2F0E6;
      --ink: #171715;
      --muted: #4E4C46;
      --faint: #7A776C;
      --soft: #FFFFFF;
      --field: #D4CBB8;
      --field-edge: #A89E8C;
      --soft-2: #C9BFAC;
      --line: #E4E0D2;
      --expr-alt: #E7E1D2;
      --bar: rgba(242, 240, 230, 0.92);
      --yellow: #F7CC00; /* voltage gold — CTA and active */
      --coral: #EF6B00;  /* burnt orange */
      --red: #E10600;    /* ruby */
      --lime: #C6F000;   /* bright yellow-green */
      --teal: #128A45;   /* deep forest */
      --blue: #1A4DFF;   /* royal blue */
      --magenta: #C026D3; /* purple / magenta */
      --day: var(--coral);
      --night: var(--blue);
      --extra: var(--magenta);
      --gap: 52px;
      --r-card: 18px;
      --r-pill: 999px;
      --r-soft: 14px;
      --r-media: 16px;
      --serif: "Lora", "Palatino Linotype", "Songti SC", serif;
      --sans: "DM Sans", "PingFang SC", "Noto Sans SC", "Hiragino Sans GB", sans-serif;
    }
    html.theme-night {
      --bg: #141311;
      --ink: #F3F0E6;
      --muted: #C4BEB2;
      --faint: #A39B8E;
      --soft: #1E1C18;
      --field: #322F2A;
      --field-edge: #A89E8C;
      --soft-2: #34302A;
      --line: #8A8276;
      --expr-alt: #2A2722;
      --bar: rgba(20, 19, 17, 0.92);
    }

    /* Hide ugly scrollbars; still scrollable */
    * { scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 8;
      background: var(--bar);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 36px 20px;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 12px 22px;
      min-height: 104px;
    }
    .logo {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      flex: 0 0 auto;
      gap: 0.3em;
      margin: 0 8px 0 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .logo-mark {
      width: 48px;
      height: 48px;
      display: block;
      flex: 0 0 auto;
    }
    .logo-mark.is-night { display: none; }
    html.theme-night .logo-mark.is-day { display: none; }
    html.theme-night .logo-mark.is-night { display: block; }
    .logo-name {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .filter-row {
      --control-h: 36px;
      display: flex;
      flex-flow: row wrap;
      align-items: center;
      align-content: center;
      gap: 8px 22px;
      margin-top: 18px;
    }
    .filter-row > .slot-nav,
    .filter-row > .date-control {
      height: var(--control-h);
      min-height: var(--control-h);
      max-height: var(--control-h);
      margin-top: 0;
      margin-bottom: 0;
      align-self: center;
    }
    .filter-row > .date-control { margin-left: auto; }
    .slot-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      height: var(--control-h);
      padding: 3px;
      box-sizing: border-box;
      background: #E3DCCE;
      border: none;
      border-radius: var(--r-pill);
      box-shadow: none;
    }
    .slot-nav button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      border: none;
      border-radius: var(--r-pill);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      padding: 0 12px;
    }
    .slot-nav button svg {
      width: 15px;
      height: 15px;
      display: block;
    }
    .slot-nav button:hover { color: var(--ink); }
    .slot-nav button.active {
      background: #F4F1E8;
      color: var(--ink);
      font-weight: 600;
      box-shadow: none;
    }
    .slot-nav button.active svg { color: #B8860B; }
    html.theme-night .slot-nav {
      background: #34312C;
      border: none;
      box-shadow: none;
    }
    html.theme-night .slot-nav button { color: #D4CFC4; }
    html.theme-night .slot-nav button:hover { color: #F3F0E6; }
    html.theme-night .slot-nav button.active {
      background: #6E675C;
      color: #F4F0E6;
      box-shadow: none;
    }
    html.theme-night .slot-nav button.active svg { color: #E6C56A; }

    .topbar input#q {
      flex: 0 1 180px;
      min-width: 0;
      margin-left: auto;
      width: 180px;
      max-width: 180px;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      border-radius: 0;
      padding: 6px 0 5px;
      font-size: 0.84rem;
      font-family: inherit;
      color: var(--ink);
      outline: none;
    }
    .topbar input#q::placeholder { color: var(--faint); }
    .topbar input#q:focus {
      background: transparent;
      border-bottom-color: var(--ink);
    }

    .date-control {
      display: flex;
      align-items: center;
      align-self: center;
      height: var(--control-h, 36px);
      margin: 0 0 0 auto;
      position: relative;
    }
    .date-toggle {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      height: 100%;
      min-height: 0;
      margin: 0;
      border: 1.5px solid var(--field-edge);
      background: var(--soft);
      color: var(--ink);
      border-radius: var(--r-pill);
      padding: 0 14px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
    }
    .date-toggle:hover { border-color: var(--ink); background: var(--soft); }
    .date-control.is-set .date-toggle {
      border-color: var(--yellow);
      box-shadow: inset 0 0 0 1px var(--yellow);
      color: var(--ink);
      font-weight: 600;
    }
    .date-popover {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      z-index: 20;
      width: 320px;
      padding: 18px 18px 14px;
      background: var(--soft);
      color: var(--ink);
      border: none;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(23, 23, 21, 0.1);
    }
    .date-popover[hidden] { display: none; }
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .cal-month {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .cal-nav {
      appearance: none;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-size: 1.7rem;
      line-height: 1;
      cursor: pointer;
    }
    .cal-nav:hover { background: var(--bg); }
    .cal-nav:disabled { color: var(--faint); cursor: default; background: transparent; }
    .cal-week, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }
    .cal-week {
      margin-bottom: 6px;
      color: var(--faint);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }
    .cal-grid button {
      appearance: none;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: transparent;
      color: var(--faint);
      font-family: inherit;
      font-size: 0.95rem;
      cursor: default;
    }
    .cal-grid button.is-live {
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
    }
    .cal-grid button.is-live:hover { background: var(--bg); }
    .cal-grid button.is-selected,
    .cal-grid button.is-selected:hover {
      background: var(--yellow);
      color: #171715;
    }
    .cal-any {
      appearance: none;
      display: block;
      margin: 12px auto 0;
      padding: 6px 8px 2px;
      border: none;
      background: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .cal-any:hover { color: var(--ink); }

    .shell {
      max-width: 1040px;
      margin: 0 auto;
      padding: 40px 36px 96px;
    }

    /* —— Main column —— */
    .main-col { min-width: 0; }

    .hero {
      margin-bottom: 56px;
    }
    .hero-frame {
      border: none;
      padding: 4px 0 0;
      border-radius: 0;
      background: transparent;
    }
    .hero-lede {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: clamp(3.15rem, 6.2vw, 5.35rem);
      line-height: 1.05;
      letter-spacing: -0.012em;
      color: var(--ink);
      max-width: 11em;
    }
    .hero-line {
      margin: 14px 0 0;
      font-family: var(--serif);
      font-weight: 400;
      font-optical-sizing: auto;
      font-size: clamp(1.7rem, 3.1vw, 2.55rem);
      line-height: 1.16;
      letter-spacing: -0.008em;
      color: var(--ink);
      max-width: none;
      white-space: nowrap;
    }

    /* —— Day blocks: space + type, no heavy rule —— */
    .day-block { margin-bottom: 80px; }
    .day-block h2 {
      font-family: var(--serif);
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: clamp(2.4rem, 4.4vw, 3.55rem);
      line-height: 1.08;
      letter-spacing: -0.01em;
      margin: 0 0 28px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding-bottom: 0;
      border-bottom: none;
      cursor: pointer;
      width: fit-content;
      max-width: 100%;
    }
    .day-chev {
      width: 18px;
      height: 18px;
      margin-right: 4px;
      border-right: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      color: var(--ink);
      transform: rotate(45deg);
      opacity: 1;
      flex: 0 0 auto;
    }
    .day-block.is-collapsed .day-chev { transform: rotate(-45deg); }
    .day-block.is-collapsed { margin-bottom: 36px; }
    .day-block.is-collapsed .day-body,
    .day-block.is-collapsed h2 { margin-bottom: 0; }
    .day-block.is-collapsed .day-body { display: none; }
    .day-block h2 span {
      font-family: var(--sans);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* —— Soft rounded cards: filled surface, no left bars —— */
    .card {
      position: relative;
      background: var(--soft);
      border: none;
      border-radius: 22px;
      padding: 22px 24px 20px;
      margin: 0 0 22px;
      border-left: none;
    }
    .card.slot-day,
    .card.slot-night,
    .card.slot-extra { border-left: none; }

    .card-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
    }
    .slot-chip, .quality-chip {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0;
      border-radius: 0;
      background: none;
      font-family: var(--sans);
      border: none;
    }
    .slot-chip.day { color: var(--day); }
    .slot-chip.night { color: #7EB6FF; }
    .slot-chip.extra { color: var(--extra); }
    html:not(.theme-night) .slot-chip.night { color: var(--night); }
    .quality-chip.thin {
      color: var(--faint);
      background: none;
      border: none;
      font-weight: 600;
    }

    .card h3 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.65rem, 2.4vw, 2.15rem);
      font-weight: 500;
      font-optical-sizing: auto;
      letter-spacing: -0.008em;
      line-height: 1.22;
    }
    .card h3 a {
      color: var(--ink);
      text-decoration: none;
    }
    .card h3 a:hover {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--yellow);
      text-underline-offset: 4px;
    }

    .meta {
      margin: 10px 0 0;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      font-weight: 500;
    }

    .dek {
      margin: 14px 0 0;
      font-size: 0.95rem;
      line-height: 1.75;
      color: var(--ink);
    }
    .dek p { margin: 0 0 0.85em; }
    .dek p:last-child { margin-bottom: 0; }
    .dek.pending {
      color: var(--muted);
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    .actions button, .actions a.btn {
      appearance: none;
      border: none;
      background: var(--soft);
      color: var(--ink);
      border-radius: var(--r-pill);
      padding: 8px 16px;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.02em;
      transition: background .12s ease, color .12s ease;
    }
    .actions button.primary {
      background: var(--yellow);
      color: #171715;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 10px 18px;
    }
    .actions button.primary:hover {
      background: #171715;
      color: var(--yellow);
    }
    .actions a.btn {
      background: transparent;
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 9px 16px;
    }
    .actions a.btn:hover {
      background: var(--ink);
      color: var(--bg);
    }

    .detail {
      display: none;
      margin-top: 18px;
    }
    .detail.open { display: block; }
    .video {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 200px;
      overflow: hidden;
      background: #111;
      margin-bottom: 0;
      border: none;
      border-radius: var(--r-media);
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .detail p { margin: 0 0 0.9em; font-size: 0.95rem; color: var(--ink); line-height: 1.75; }
    .detail p:last-child { margin-bottom: 0; }
    .dek ol.points,
    .detail ol.points,
    .note-panel ol.points {
      margin: 0.2em 0 0.4em;
      padding: 0 0 0 1.35em;
      line-height: 1.75;
    }
    .dek ol.points li,
    .detail ol.points li,
    .note-panel ol.points li {
      margin: 0 0 0.75em;
      padding: 0;
    }
    .dek ol.points li:last-child,
    .detail ol.points li:last-child,
    .note-panel ol.points li:last-child { margin-bottom: 0; }
    .detail .label {
      display: block;
      color: var(--muted);
      background: none;
      font-size: 0.72rem;
      margin: 18px 0 6px;
      padding: 0;
      border-radius: 0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .detail .label.why,
    .detail .label.level { background: none; color: var(--muted); }
    .detail .label:first-of-type { margin-top: 0; }
    .detail-notes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 22px;
    }
    .note-panel {
      background: var(--expr-alt);
      border-radius: 16px;
      padding: 16px 18px 15px;
    }
    html.theme-night .note-panel {
      background: #2C2923;
      box-shadow: inset 0 0 0 1px #6E675C;
    }
    .note-panel .label {
      margin: 0 0 8px;
      color: var(--faint);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      font-weight: 600;
    }
    .note-panel > p,
    .note-panel > ol {
      margin: 0 0 0.75em;
    }
    .note-panel > :last-child { margin-bottom: 0; }
    .detail .pending {
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .expr {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 0;
      padding: 0;
    }
    .expr-card {
      border: none;
      border-radius: 16px;
      padding: 16px 18px 15px;
      background: var(--expr-alt);
    }
    .expr-card:nth-child(even) { background: #F3EEE4; }
    html.theme-night .expr-card { background: #2C2923; }
    html.theme-night .expr-card:nth-child(even) { background: #35312B; }
    .expr-en {
      margin: 0 0 8px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 1.12rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--ink);
    }
    .expr-zh {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--muted);
    }
    .day-expr {
      margin-top: 8px;
      padding: 22px 24px 20px;
      background: var(--soft);
      border: none;
      border-radius: 22px;
    }
    .day-expr h4 {
      margin: 0 0 12px;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.6rem, 2.4vw, 2rem);
      font-weight: 500;
      font-optical-sizing: auto;
      font-style: italic;
      letter-spacing: -0.008em;
      line-height: 1.15;
    }

    footer {
      margin-top: 64px;
      padding-top: 8px;
      border-top: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 10px;
      color: var(--faint);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
    }
    footer strong {
      font-family: var(--serif);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--ink);
      font-weight: 400;
      letter-spacing: 0;
    }
    footer .mark-sq {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: var(--r-pill);
      background: var(--yellow);
      margin-right: 8px;
      vertical-align: middle;
    }

    @media (max-width: 800px) {
      .topbar-inner { padding: 26px 18px 16px; }
      .topbar-row { flex-wrap: nowrap; min-height: 88px; gap: 12px; }
      .logo { font-size: 1.2rem; gap: 8px; }
      .logo-mark { width: 48px; height: 48px; }
      .topbar input#q {
        margin-left: auto;
        flex: 0 1 148px;
        width: 148px;
        max-width: 42%;
        min-width: 0;
      }
      .filter-row { margin-top: 14px; gap: 8px 10px; }
      .slot-nav button { padding: 0 10px; gap: 5px; font-size: 0.82rem; }
      .date-toggle { padding: 0 12px; font-size: 0.8rem; }
      .date-control { margin-left: auto; }
      .shell { padding: 28px 18px 80px; }
      .hero { margin-bottom: 36px; }
      .hero-frame { padding: 0; }
      .hero-lede { font-size: 2.65rem; max-width: none; }
      .hero-line { font-size: 1.45rem; max-width: none; white-space: normal; }
      .day-block h2 { font-size: 2.15rem; }
      .card { margin-bottom: 16px; padding: 18px; }
      .day-expr { padding: 18px; }
      .expr { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-row">

    const slotLabel = { day: "Day", night: "Night", extra: "Day" };
    function effectiveSlot(item) {
      return item && item.slot === "extra" ? "day" : (item && item.slot) || "";
    }
    function defaultSlot() {
      const hour = new Date().getHours();
      return hour >= 6 && hour < 18 ? "day" : "night";
    }
    function applyTheme() {
      const night = slot === "night";
      document.documentElement.classList.toggle("theme-night", night);
      const color = night ? "#141311" : "#F2F0E6";

    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    function fmtDateShort(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}`;
    }

    function fmtDateHeading(d) {
      const [y,m,dd] = d.split("-");
      return `${MONTHS[Number(m)-1]} ${Number(dd)}, ${y}`;
    }

    function matchItem(item, day) {
      if (effectiveSlot(item) !== slot) return false;
      if (dayFilter !== "all" && day.date !== dayFilter) return false;
      if (query) {
        const hay = [item.title, item.channel, item.summary, item.why, item.difficulty, day.date].join(" ").toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    function formatDuration(d) {
      if (d == null || d === "") return "duration TBD";
      const s = String(d).trim();
      const m = s.match(/^约\s*(\d+)\s*分钟$/);
      if (m) return `~${m[1]} min`;
      return s;
    }

    function embedSrc(id) {
      return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1`;
    }

    function iframeHtml(id) {
      return `<iframe src="${embedSrc(id)}" title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    }

    function mountEmbed(box) {
      if (!box || box.querySelector("iframe")) return;
      const id = box.dataset.vid;
      if (!id) return;
      box.innerHTML = iframeHtml(id);
    }

    function clearEmbed(box) {
      if (box) box.innerHTML = "";
    }


    const CIRCLED = /[\u2460-\u2473]/;

    function stripEdgePunct(s) {
      return String(s || "").trim().replace(/^[：:.\s]+/, "").replace(/[：:；;\s]+$/, "");
    }

    function splitEnumerated(text) {
      const re = /(?:^|\s)(\d{1,2})[.、．)）]\s+/g;
      const marks = [];
      let m;
      while ((m = re.exec(text))) {
        const num = Number(m[1]);
        if (num < 1 || num > 30) continue;
        marks.push({ index: m.index + (m[0].startsWith(" ") || m[0].startsWith("\n") ? 1 : 0), len: m[0].length - (m[0].startsWith(" ") ? 1 : 0) });
      }
      if (marks.length < 2) return null;
      const lead = stripEdgePunct(text.slice(0, marks[0].index));
      const items = [];
      for (let i = 0; i < marks.length; i++) {
        const start = marks[i].index + marks[i].len;
        const end = i + 1 < marks.length ? marks[i + 1].index : text.length;
        const body = stripEdgePunct(text.slice(start, end));
        if (body) items.push(body);
      }
      return items.length ? { lead, items } : null;
    }

    function splitCircled(text) {
      if (!CIRCLED.test(text)) return null;
      const chunks = text.split(/(?=[\u2460-\u2473])/);
      let lead = "";
      const items = [];
      chunks.forEach(chunk => {
        if (CIRCLED.test(chunk.charAt(0))) {
          const body = stripEdgePunct(chunk.slice(1));
          if (body) items.push(body);
        } else {
          lead = stripEdgePunct(chunk);
        }
      });
      return items.length ? { lead, items } : null;
    }

    function splitSentences(text) {
      const parts = text.split(/(?<=[。！？])/).map(s => s.trim()).filter(Boolean);
      const paras = [];
      parts.forEach(sentence => {
        if (sentence.length > 140 && (sentence.match(/；/g) || []).length >= 2) {
          sentence.split("；").map(s => s.trim()).filter(Boolean).forEach((bit, i, arr) => {
            paras.push(i < arr.length - 1 ? bit + "；" : bit);
          });
        } else {
          paras.push(sentence);
        }
      });
      return paras;
    }

    function formatRich(raw) {
      const text = String(raw || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      const listed = splitCircled(text) || splitEnumerated(text);
      if (listed) {
        let html = "";
        if (listed.lead) html += `<p>${escapeHtml(listed.lead)}</p>`;
        html += `<ol class="points">` + listed.items.map(item => `<li>${escapeHtml(item)}</li>`).join("") + `</ol>`;
        return html;
      }
      const paras = splitSentences(text);
      if (paras.length >= 3 || (text.length > 160 && paras.length > 1)) {
        return paras.map(p => `<p>${escapeHtml(p)}</p>`).join("");
      }
      return `<p>${escapeHtml(text)}</p>`;
    }

    function summaryBlock(item, thin) {
      if (thin) return `<p class="dek pending">Summary still catching up — open the video meanwhile.</p>`;
      const html = formatRich(item.summary);
      return html ? `<div class="dek">${html}</div>` : "";
    }

    function readClosedDays() {
      try {
        const parsed = JSON.parse(localStorage.getItem(DAY_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (e) {
        return {};
      }
    }

    function writeClosedDays(map) {
      try { localStorage.setItem(DAY_KEY, JSON.stringify(map)); } catch (e) {}
    }

    function syncDateLabel() {
      const control = dateToggle.closest(".date-control");
      if (dayFilter === "all") {
        dateToggle.textContent = "Pick a date";
        control.classList.remove("is-set");
      } else {
        dateToggle.textContent = fmtDateShort(dayFilter);
        control.classList.add("is-set");
      }
    }

    function render() {
      applyTheme();
      syncDateLabel();
      main.innerHTML = "";
      const closedDays = readClosedDays();

      DATA.days.forEach(day => {
        const items = day.items.filter(it => matchItem(it, day));
        if (!items.length) return;

        const closed = !!closedDays[day.date];
        const block = document.createElement("section");
        block.className = "day-block" + (closed ? " is-collapsed" : "");
        block.id = "day-" + day.date;
        const h2 = document.createElement("h2");
        const approx = day.day_assignment && String(day.day_assignment).startsWith("approximate");
        h2.innerHTML = `<span class="day-chev" aria-hidden="true"></span>` +
          escapeHtml(fmtDateHeading(day.date)) +
          (approx ? ` <span>Date approximate</span>` : "");
        h2.tabIndex = 0;
        h2.setAttribute("role", "button");
        h2.setAttribute("aria-expanded", closed ? "false" : "true");
        h2.setAttribute("aria-controls", "body-" + day.date);
        block.appendChild(h2);
        const body = document.createElement("div");
        body.className = "day-body";
        body.id = "body-" + day.date;
        block.appendChild(body);

        items.forEach(item => {
          const card = document.createElement("article");
          const shownSlot = effectiveSlot(item);
          card.className = "card slot-" + shownSlot;
          card.dataset.id = item.id;
          const thin = item.summary_quality !== "full";
          const whyBlock = (!thin && item.why)
            ? `<aside class="note-panel"><p class="label why">Why watch</p>${formatRich(item.why)}</aside>`
            : "";
          const diffBlock = (!thin && item.difficulty)
            ? `<aside class="note-panel"><p class="label level">English level</p>${formatRich(item.difficulty)}</aside>`
            : "";
          const notes = (whyBlock || diffBlock) ? `<div class="detail-notes">${whyBlock}${diffBlock}</div>` : "";
          const pendingChip = thin ? `<span class="quality-chip thin">Pending</span>` : "";
          card.innerHTML = `
            <div class="card-head">
              <span class="slot-chip ${shownSlot}" aria-label="${slotLabel[shownSlot] || shownSlot}">${slotLabel[shownSlot] || shownSlot}</span>

            ${summaryBlock(item, thin)}
            <div class="actions">
              <button type="button" class="primary" data-act="toggle">Collapse</button>

            </div>
            <div class="detail open" id="d-${item.id}">
              <div class="video" data-vid="${escapeHtml(item.id)}"></div>
              ${notes}
            </div>`;
          body.appendChild(card);
          mountEmbed(card.querySelector(".video"));

        if (day.expressions && day.expressions.length && items.length) {

            `</div>`;
          body.appendChild(ex);
        }

        main.appendChild(block);
      });

    }

    function toggleDay(heading) {
      const block = heading.closest(".day-block");

    function monthIndex(iso) {
      const [y, m] = iso.split("-").map(Number);
      return y * 12 + (m - 1);
    }
    let minMonth = knownDates.length ? monthIndex(knownDates[0]) : 0;
    let maxMonth = knownDates.length ? monthIndex(knownDates[knownDates.length - 1]) : 0;

    function closePopover() {
      datePopover.hidden = true;
      dateToggle.setAttribute("aria-expanded", "false");
    }

    function renderCalendar() {
      const label = new Date(viewYear, viewMonth, 1).toLocaleString("en-US", { month: "long", year: "numeric" });
      calMonth.textContent = label;
      const here = viewYear * 12 + viewMonth;
      calPrev.disabled = here <= minMonth;
      calNext.disabled = here >= maxMonth;
      calGrid.innerHTML = "";
      const firstDow = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      for (let i = 0; i < firstDow; i++) calGrid.appendChild(document.createElement("span"));
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${viewYear}-${String(viewMonth + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = String(d);
        const live = knownSet.has(iso);
        if (live) btn.classList.add("is-live");

            closePopover();
            render();
          });

        calGrid.appendChild(btn);
      }

    function openPopover() {

      const [y, m] = base.split("-").map(Number);
      viewYear = y;
      viewMonth = m - 1;

      dateToggle.setAttribute("aria-expanded", "true");

    calNext.addEventListener("click", (e) => {

      }
    });

    function adoptArchive(next) {
      if (!next || !Array.isArray(next.days)) return false;
      DATA = next;
      knownDates = DATA.days.map(d => d.date).sort();
      knownSet = new Set(knownDates);
      minMonth = knownDates.length ? monthIndex(knownDates[0]) : 0;
      maxMonth = knownDates.length ? monthIndex(knownDates[knownDates.length - 1]) : 0;
      return true;
    }

    render();
    fetch("archive.json", { cache: "no-store" })
      .then(res => {
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      })
      .then(parsed => {
        if (adoptArchive(parsed)) render();
      })
      .catch(() => {});

  </script>
</body>
</html>
